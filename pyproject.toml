[project]
name = "aegisgate-enterprise"
version = "1.0.0"
description = "Local AI agent security gateway and validation lab"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "httpx>=0.27,<1"]
[project.optional-dependencies]
ai = ["anthropic>=0.40,<1", "python-dotenv>=1,<2"]
mcp = ["mcp>=1.9,<2"]
dashboard = ["streamlit>=1.38,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.7,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 110
