services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - aegis-data:/srv/data
    environment:
      AEGIS_DB: /srv/data/aegisgate.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  aegis-data:
